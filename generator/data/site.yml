brand: "Neva Beauty"
brand_location: "Da Nang"
tagline: "Центр красоты · Дананг"
# Написание города единообразно по всему сайту: «Дананг». Разнобой («Да Нанг»)
# мешает поиску и ИИ-ассистентам собрать одну сущность бизнеса.
location: "Дананг, Вьетнам"

# Два салона бренда — два самостоятельных сайта на своих доменах. Список один
# и тот же на обоих, отличается только флагом current: он говорит, на каком
# сайте гость сейчас, и подставляет в ссылку главную вместо внешнего адреса.
# Связь нужна в обе стороны: человек, нашедший в поиске не ту страну, уходит
# на нужный сайт, а не закрывает вкладку.
locations:
  - city: "Самуи"
    country: "Таиланд"
    url: "https://th.neva.beauty"
    # Язык того сайта. На странице другого языка ссылка получает hreflang и пометку,
    # что сайт салона на этом языке: английский гость не должен попасть туда вслепую.
    language: ru
  - city: "Дананг"
    country: "Вьетнам"
    url: "https://vn.neva.beauty"
    current: true

hours: "Приём по записи"
base_url: "https://vn.neva.beauty"
# Префикс пути для ссылок на ассеты/внутренние страницы (не SEO-URL, те всегда base_url).
# Пусто = сайт в корне домена (боевой). "/vn.neva.beauty" = превью на GitHub Pages по подпути.
base_path: ""
# Языки сайта в порядке сборки. Первый — основной: он живёт в корне домена.
# Описание каждого — в data/locales/<код>.yml.
locales: [ru, en]
# Язык для hreflang="x-default" (страница «для всех остальных»). По спеке (раздел о
# hreflang) это английская версия: гость с браузером не на русском и не на английском
# скорее прочтёт английский.
x_default_locale: en
# Выбор языка по браузеру (спека, раздел 14): при первом входе извне гость попадает на
# версию языка своего браузера. Группы языков — browser_languages в файлах языков,
# остальным — fallback_locale. false — строчный скрипт убирается пересборкой.
auto_language: true
fallback_locale: en
# Яндекс.Метрика: номер счётчика (перенесён со старого сайта). Пусто = не подключать.
metrika_id: 106778458
contacts:
  whatsapp_number: "84357132621"
  whatsapp_url: "https://wa.me/84357132621"
  telegram_url: "https://t.me/doctor_cosmetolog_pro"
  # Подставлять ли текст обращения в ссылку Telegram (t.me/<имя>?text=…). Если на
  # каком-то устройстве такая ссылка не открывает чат — false: Telegram останется
  # без текста, а откуда пишут, покажет только Метрика.
  telegram_prefill: true
  instagram_url: "https://instagram.com/vn.neva.beauty"

# Консультация косметолога (ответ владельца 2026-10-26). Цену сборка подставляет в ответы
# о записи вместо {consultation_price} (pages.content_tokens); что при процедуре консультация
# входит в её стоимость, сказано там же словами. Запись — как у строк прайса. Не в prices.json:
# там прайс-листы страниц услуг, и check_prices.py ищет по каждому ключу страницу услуги.
consultation:
  price: "500 000 đ"

# Единый источник фактов о бизнесе для JSON-LD (schema.org). Только реальные
# данные; отсутствующие поля закомментированы как TODO — не выдумываем.
business:
  type: "BeautySalon"                 # заказчик: салон красоты (не мед-клиника)
  telephone: "+84357132621"           # основной телефон, он же WhatsApp
  price_range: "$$"                   # качественный ориентир (Google priceRange)
  currency: "VND"
  language: ["Russian", "English"]    # языки обслуживания → availableLanguage в ContactPoint
  image: "/assets/img/hero.webp"
  logo: "/assets/img/logo-neva-beauty.png"  # круглая печать с лотосом, 512×512 (растр:
                                            # его ждут карточки организации у Google и Яндекса)
  same_as:
    - "https://www.instagram.com/vn.neva.beauty/"
    - "https://t.me/doctor_cosmetolog_pro_channel"   # публичный Telegram-канал
  # Описание салона для разметки (посетителю не видно): пересказ блока «Коротко о Neva Beauty»
  # без новых фактов. Английское — в locales/en.yml, site.business.description.
  description: "Neva Beauty — центр красоты в Дананге (Вьетнам): аппаратная косметология, лазерная эпиляция, лифтинг и омоложение, уход за лицом и коррекция фигуры. Приём по записи, обслуживание на русском и английском языках."
  address:
    locality: "Da Nang"
    country: "VN"
    # streetAddress не публикуем — заказчик: только город; адрес выдаётся при записи
  # geo не публикуем (адрес по записи)
  # openingHours не задаём — приём по записи (см. site.hours)
