# Английский язык сайта. Тексты страниц, прайса и политики лежат рядом, в en/;
# строки интерфейса (ui) переводит этап 7. Пока ui пуст, язык не включён в site.yml.
# Строка с параметрами ({title}, {price}, ...) форматируется через str.format, поэтому
# буквальные фигурные скобки пишутся удвоенными: {{ и }}.
code: en
html_lang: en
og_locale: en_US
url_prefix: "/en"

# Адреса утверждены владельцем 2026-10-14 и заморожены: смена слага после запуска
# ломает ссылки и сбрасывает накопленное в поиске.
