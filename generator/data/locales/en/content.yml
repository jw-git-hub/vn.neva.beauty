      makeup removal</a> and the <a href="/karbonovyy-lazernyy-piling/">carbon laser peel</a>. All of
      them are non-surgical, and the treatment plan is chosen at the consultation.'
  - q: What is the difference between laser hair removal, pigment removal and the carbon laser peel?
    a: '<a href="/lazernaya-epilyaciya/">Laser hair removal</a> removes unwanted hair by targeting the
