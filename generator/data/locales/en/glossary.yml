# Утверждённый глоссарий английской версии (EN-остановка-1.md, утверждено 2026-10-14).
# Источник истины — этот файл; проверка пар строк (этап 9) сверяет по нему обязательные термины.
# Поля термина:
#   ru        — русский термин, как в глоссарии (без пометки «где применяется» в скобках — она в note);
#   en        — утверждённый перевод;
#   required  — слово, которое обязано стоять в английской строке, если в русской есть термин
#               (столбец «Обязателен в паре»); нет поля — термин не обязателен;
#   forbidden — варианты, которые глоссарий прямо отвергает для этого термина (слово или выражение целиком);
#   note      — толкование («что это слово значит для носителя») и условия применения;
#   section   — раздел глоссария.

rules:
  - "Один русский термин — один английский на весь сайт."
  - "Написание американское: «center», «color», «makeup»."
  - "Названия аппаратов и косметики — как у производителя: Morpheus8 (слитно, хотя на русском сайте «Morpheus 8»), HydraFacial, PRX-T33. Исключение (ответ салона 9): маска — «HydroPeptid», буква в букву как в русском прайсе."
  - "Оборудование не додумывается: производитель, тип технологии и состав средства — только с подтверждения салона. Подтверждено 2026-10-13: SMAS-лифтинг называется HIFU, карбокситерапия — без уколов. Марка аппарата HIFU не называется (ответ салона 3). «M22» остаётся «M22» без производителя и типа технологии; слова IPL на сайте нет нигде (ответ салона 2)."
  - "Обещания не усиливаются: английское слово не сильнее и не слабее русского. «Долгосрочная гладкость» — не «навсегда» (permanent), «не требует длительного восстановления» — не «без восстановления»."
  - "Слова «doctor», «physician», «clinic» и «medical» про Neva Beauty и его специалистов не используются (решение владельца 2026-10-13, ответы салона 1 и 4). Названия чужих клиник и общие объяснения — не в счёт."
  - "Числа и цены в переводе не хранятся: их подставляет сборка из русского прайса."
  - "Город пишется раздельно: «Da Nang»."
  - "Название услуги — это H1, пункт меню, подпись карточки и строка «хлебных крошек», поэтому оно короткое и без города."
  - "Обязательные термины (required) проверяются в текстах страниц и ответах на вопросы, но не в title и description: там обещания намеренно опущены."
  - "Строка прайса переводится целиком по словарю: русская строка — ключ, английская — значение. Числа в описаниях подставляет сборка из русской строки; в en они показаны для наглядности."
  - "Позиции прайса, разобранные в других разделах, в «Строках прайса» не повторяются: «Карбоновый лазерный пилинг» — «Услуги и разделы»; «Костюм для LPG», «УЗ-кавитация», «HydraFacial», «Карбокситерапия», «Чистка лица», «Ультразвуковая чистка», «Альгинатная маска», «RF-терапия», «Ультразвуковая терапия» — «Аппараты и методы»; все зоны — «Зоны тела и лица»."

terms:
  # — Услуги и разделы —
  - ru: "Лазерная эпиляция"
    en: "Laser Hair Removal"
    forbidden: ["laser epilation"]
    note: "«Удаление волос лазером». Слово «epilation» в английском есть, но в быту его почти не используют: оно звучит как технический термин или как работа домашним эпилятором."
    section: "Услуги и разделы"
  - ru: "LPG-массаж"
    en: "LPG Massage"
    required: "LPG"
    forbidden: ["endermologie"]
    note: "Массаж на аппарате LPG: ролики и вакуум захватывают складку кожи. Знающие клиенты узнают процедуру по буквам LPG. Фирменное название самого метода — «endermologie»; в текст оно не добавляется, потому что в русском его нет."
    section: "Услуги и разделы"
  - ru: "Эндосфера-терапия"
    en: "Endosphere Therapy"
    required: "Endosphere"
    note: "Массаж аппаратом с вращающимися шариками-сферами. Само слово «therapy» англоязычный читатель и Google легко принимают за психотерапию, поэтому рядом всегда стоит «body», «face» или «massage». Встречается и написание «Endospheres» с буквой s на конце — оно пригодится в тексте как второе."
    section: "Услуги и разделы"
  - ru: "Ультразвуковая кавитация"
    en: "Ultrasonic Cavitation"
    note: "Воздействие ультразвуком на жировую ткань без операции. Это устойчивое название процедуры. «Ultrasound cavitation» тоже поймут, но пишут реже."
    section: "Услуги и разделы"
  - ru: "Ультразвуковой SMAS-лифтинг"
    en: "HIFU Treatment"
    forbidden: ["SMAS lifting", "SMAS facelift"]
    note: "«Процедура HIFU»: подтяжка сфокусированным ультразвуком высокой интенсивности; под этим словом её знают и ищут. Дословное «SMAS lifting» как название не годится: «SMAS facelift» у англоязычных — это хирургическая подтяжка лица у пластического хирурга. В текстах коротко — «HIFU» (ответ салона 3)."
    section: "Услуги и разделы"
  - ru: "Лазерное удаление татуировок"
    en: "Laser Tattoo Removal"
    note: "«Удаление татуировок лазером» — прямое и единственное принятое название."
    section: "Услуги и разделы"
  - ru: "Удаление перманентного макияжа"
    en: "Permanent Makeup Removal"
    note: "«Удаление перманентного макияжа». Про брови англоязычные чаще говорят «eyebrow tattoo removal» — «удаление татуировки бровей»; эти слова будут стоять в описании страницы и в первом абзаце."
    section: "Услуги и разделы"
  - ru: "Карбоновый лазерный пилинг"
    en: "Carbon Laser Peel"
    note: "Где: услуга и позиция прайса. «Карбоновый лазерный пилинг» — устойчивое название. Второе, разговорное имя процедуры — «Hollywood peel»."
    section: "Услуги и разделы"
  - ru: "Игольчатый RF-лифтинг Morpheus 8"
    en: "Morpheus8 RF Microneedling"
    required: "Morpheus8"
    forbidden: ["needle RF lifting"]
    note: "«Микроигольчатая радиочастотная процедура на аппарате Morpheus8». «Microneedling» — проколы кожи тонкими иглами, «RF» — радиочастота. Дословное «needle RF lifting» — калька: так по-английски не говорят."
    section: "Услуги и разделы"
  - ru: "Фотоомоложение M22"
    en: "M22 Photorejuvenation"
    required: "M22"
    forbidden: ["IPL"]
    note: "Дословно «фотоомоложение M22»: омоложение кожи светом на аппарате M22. Слово правильное и понятное, но в поиске его почти не набирают. Тип технологии в названии не указан."
    section: "Услуги и разделы"
  - ru: "Эстетический уход за лицом"
    en: "Facial Treatments"
    forbidden: ["aesthetic"]
    note: "«Процедуры для лица». «Facial» у англоязычных — любая салонная процедура ухода за лицом: чистка, маска, пилинг. Слово «aesthetic» сюда не переносится: рядом с «facial» оно читалось бы как «эстетическая медицина»."
    section: "Услуги и разделы"
  - ru: "Коррекция фигуры"
    en: "Non-Surgical Body Contouring"
    required: "non-surgical"
    note: "Где: раздел. «Безоперационная коррекция контуров тела». Без слова «non-surgical» англоязычный читатель и Google понимают «body contouring» как липосакцию и пластику: именно они стоят в выдаче по Данангу."
    section: "Услуги и разделы"
  - ru: "Фигура"
    en: "Body"
    forbidden: ["figure"]
    note: "Где: пункт меню. «Тело». Короткое слово для меню: «процедуры для тела». «Figure» в этом значении звучит старомодно."
    section: "Услуги и разделы"
  - ru: "Лифтинг и омоложение"
    en: "Non-Surgical Face Lift & Rejuvenation"
    required: "non-surgical"
    note: "Где: раздел. «Безоперационная подтяжка лица и омоложение». Одно слово «face lift» означает операцию, поэтому нужно «non-surgical». Слово «lifting» как название процедуры по-английски почти не используют — это европейская привычка."
    section: "Услуги и разделы"
  - ru: "Омоложение"
    en: "Rejuvenation"
    note: "Где: пункт меню. «Омоложение» — прямое соответствие. Близкое по смыслу «anti-aging» означает «против старения»."
    section: "Услуги и разделы"
  - ru: "Лазерные процедуры"
    en: "Laser Treatments"
    forbidden: ["laser procedures"]
    note: "Где: раздел. «Лазерные процедуры». «Laser procedures» звучало бы как лазерные операции: «procedure» по-английски — врачебная манипуляция."
    section: "Услуги и разделы"
  - ru: "Лазер"
    en: "Laser"
    note: "Где: пункт меню. «Лазер» — прямое соответствие."
    section: "Услуги и разделы"
  - ru: "Уход за лицом"
    en: "Facials"
    forbidden: ["facial care"]
    note: "Где: раздел. «Процедуры ухода за лицом», множественное число от «facial». Дословное «facial care» чаще встречается на баночках с кремом, чем в названии услуг."
    section: "Услуги и разделы"
  - ru: "Уход"
    en: "Facials"
    note: "Где: пункт меню. То же слово, что в названии раздела: короче по-английски не скажешь. «Care» без уточнения — это «забота» или «уход за больным»."
    section: "Услуги и разделы"
  # — Зоны тела и лица —
  - ru: "Лоб"
    en: "Forehead"
    note: "Где: эпиляция. Лоб: от бровей до линии роста волос."
    section: "Зоны тела и лица"
  - ru: "Верхняя губа"
    en: "Upper lip"
    note: "Где: эпиляция. Полоска кожи над верхней губой, «усики». Сама губа под этим словом в прайсе эпиляции не понимается."
    section: "Зоны тела и лица"
  - ru: "Лицо полностью"
    en: "Full face"
    note: "Где: эпиляция. Всё лицо: лоб, щёки, зона бакенбард, верхняя губа, подбородок. Шея в «full face» не входит — у клиник она идёт отдельной строкой."
    section: "Зоны тела и лица"
  - ru: "Шея"
    en: "Neck"
    note: "Где: эпиляция у мужчин, SMAS-лифтинг, Morpheus 8, M22. Шея целиком, спереди и сзади. Слово одно для всех четырёх услуг."
    section: "Зоны тела и лица"
  - ru: "Грудь"
    en: "Chest"
    forbidden: ["breasts"]
    note: "Где: эпиляция. Грудная клетка спереди — нейтральное слово и для мужчин, и для женщин. «Breasts» означало бы молочные железы и в прайсе эпиляции звучит неуместно. «Décolleté» — только верх груди под шеей, это другая зона."
    section: "Зоны тела и лица"
  - ru: "Ареолы"
    en: "Areolas"
    note: "Где: эпиляция. Тёмные кружки кожи вокруг сосков. В прайсах встречается и «nipples» (соски), но «areolas» точнее повторяет русское."
    section: "Зоны тела и лица"
  - ru: "Живот"
    en: "Abdomen"
    note: "Где: эпиляция, SMAS-лифтинг. Живот целиком, от рёбер до лобка. «Stomach» — то же самое в разговорной речи; «tummy» — бытовое, почти детское слово."
    section: "Зоны тела и лица"
  - ru: "Живот полностью"
    en: "Full abdomen"
    note: "Где: Morpheus 8. Весь живот, верх и низ. Слово «full» отвечает русскому «полностью»."
    section: "Зоны тела и лица"
  - ru: "Плечо"
    en: "Upper arms"
    forbidden: ["shoulder", "shoulders"]
    note: "Где: эпиляция. Часть руки от локтя до плечевого сустава. Словарное «shoulder» означало бы сам сустав и надплечье — место, где лежит лямка сумки; гость, заплативший за «shoulders», ждал бы обработки именно там."
    section: "Зоны тела и лица"
  - ru: "Предплечье"
    en: "Forearms"
    forbidden: ["half arms"]
    note: "Где: эпиляция. Часть руки от запястья до локтя. Клиники пишут также «lower arms» и «half arms»; «half arms» («полруки») не говорит, какая половина, а у салона две отдельные строки."
    section: "Зоны тела и лица"
  - ru: "Руки полностью"
    en: "Full arms"
    note: "Где: эпиляция. Обе руки от плечевого сустава до запястья. Кисти и пальцы в английское «arms» не входят — для них есть слово «hands»."
    section: "Зоны тела и лица"
  - ru: "Руки"
    en: "Arms"
    note: "Где: SMAS-лифтинг. Руки от плечевого сустава до запястья, без кистей."
    section: "Зоны тела и лица"
  - ru: "Руки до локтя"
    en: "Forearms"
    note: "Где: Morpheus 8. Часть руки от запястья до локтя — то же английское слово, что у «Предплечья» в эпиляции. Кисти идут в этом прайсе отдельной строкой."
    section: "Зоны тела и лица"
  - ru: "Руки от локтя до плеча"
    en: "Upper arms"
    note: "Где: Morpheus 8. Часть руки от локтя до плечевого сустава — то же английское слово, что у «Плеча» в эпиляции."
    section: "Зоны тела и лица"
  - ru: "Кисти"
    en: "Hands"
    forbidden: ["wrists", "palms"]
    note: "Где: Morpheus 8. Кисти рук; в процедурах омоложения гость понимает это как тыльную сторону кистей. «Wrists» — это запястья, «palms» — ладони."
    section: "Зоны тела и лица"
  - ru: "Кисти рук"
    en: "Hands"
    note: "Где: M22. То же, что «Кисти»: в английском уточнение «рук» не нужно."
    section: "Зоны тела и лица"
  - ru: "Подмышечные впадины"
    en: "Underarms"
    note: "Где: эпиляция. Подмышки. «Armpits» значит то же, но звучит грубее; в прайсах пишут «underarms»."
    section: "Зоны тела и лица"
  - ru: "Спина"
    en: "Back"
    note: "Где: эпиляция. Вся спина от плеч до поясницы. Клиники иногда делят её на «upper back» и «lower back»; без уточнения читается как вся спина."
    section: "Зоны тела и лица"
  - ru: "Классическое бикини"
    en: "Bikini line"
    note: "Где: эпиляция. «Линия бикини»: волосы по краю белья — по бокам и сверху, то, что видно из-под купальника."
    section: "Зоны тела и лица"
  - ru: "Глубокое бикини"
    en: "Brazilian"
    forbidden: ["deep bikini", "extended bikini"]
    note: "Где: эпиляция. «Бразильская» эпиляция: волосы удаляют во всей интимной зоне спереди назад, включая половые губы и складку между ягодицами. Дословного «deep bikini» в английском почти нет. Промежуточная зона — глубже линии белья, но не всё — называется «extended bikini». Для мужчин клиники используют то же слово («men's Brazilian»). «Brazilian» — в строке прайса, в трёх комбо-наборах и в ответе о зонах на странице эпиляции (ответ салона 6)."
    section: "Зоны тела и лица"
  - ru: "Голени"
    en: "Lower legs"
    note: "Где: эпиляция. Ноги от колена до щиколотки. Входит ли само колено, слово не говорит — так же, как русское «голени»."
    section: "Зоны тела и лица"
  - ru: "Бедра"
    en: "Thighs"
    forbidden: ["hips"]
    note: "Где: эпиляция, SMAS-лифтинг. Ноги от колена до паха. Не «hips»: это бока таза — «бёдра» в смысле «обхват бёдер». В эпиляции сомнений нет: «Голени» + «Бедра» складываются в «Ноги полностью»."
    section: "Зоны тела и лица"
  - ru: "Внутренняя часть бедра"
    en: "Inner thighs"
    note: "Где: Morpheus 8. Внутренняя сторона ног выше колена."
    section: "Зоны тела и лица"
  - ru: "Ягодицы"
    en: "Buttocks"
    note: "Где: эпиляция. Ягодицы; нейтральное слово для прайса. «Butt» — разговорное, «bottom» — детское."
    section: "Зоны тела и лица"
  - ru: "Ноги полностью"
    en: "Full legs"
    note: "Где: эпиляция. Ноги целиком, от паха до щиколотки. Стопы и пальцы ног в «legs» обычно не входят."
    section: "Зоны тела и лица"
  - ru: "Все тело"
    en: "Full body"
    note: "Где: эпиляция. Все зоны тела. Англоязычные клиники всегда расшифровывают, что входит в «full body» (чаще всего без лица), — гость наверняка спросит об этом при записи."
    section: "Зоны тела и лица"
  - ru: "Колени"
    en: "Knees"
    note: "Где: SMAS-лифтинг, Morpheus 8. Область коленей. Второго значения у слова нет."
    section: "Зоны тела и лица"
  - ru: "Лицо"
    en: "Face"
    note: "Где: SMAS-лифтинг, Morpheus 8, M22. Лицо. Шея и зона вокруг глаз в этих прайсах идут отдельными строками."
    section: "Зоны тела и лица"
  - ru: "Глаза"
    en: "Eye area"
    forbidden: ["eyes"]
    note: "Где: SMAS-лифтинг, Morpheus 8. «Зона вокруг глаз»: кожа под глазами, у внешних уголков и под бровью. Дословное «eyes» означало бы сами глаза — для процедуры с ультразвуком или иглами это звучит пугающе. «Eyelids» — только веки."
    section: "Зоны тела и лица"
  - ru: "Декольте"
    en: "Décolleté"
    forbidden: ["cleavage"]
    note: "Где: SMAS-лифтинг, Morpheus 8. Верх груди под шеей, который открывает вырез платья. Отличается от «chest» (вся грудь) и от «cleavage» (ложбинка между грудями). Встречается и форма «décolletage» — то же самое."
    section: "Зоны тела и лица"
  - ru: "Подчелюстная зона"
    en: "Under-chin area"
    forbidden: ["jawline", "double chin", "submental area"]
    note: "Где: SMAS-лифтинг. Зона под подбородком и нижней челюстью — там, где бывает «второй подбородок». «Jawline» — это сама линия челюсти, «chin» — подбородок спереди, «double chin» («второй подбородок») — название проблемы, а не зоны. Врачебное «submental area» обычный гость не поймёт."
    section: "Зоны тела и лица"
  - ru: "Брови"
    en: "Eyebrows"
    note: "Где: удаление перманента."
    section: "Зоны тела и лица"
  - ru: "Веки"
    en: "Eyelids"
    note: "Где: удаление перманента. Веки, верхние и нижние. Перманент на веках англоязычные называют «permanent eyeliner» — «перманентная подводка»; в прайсе оставлено название зоны, как в русском."
    section: "Зоны тела и лица"
  - ru: "Губы"
    en: "Lips"
    note: "Где: удаление перманента."
    section: "Зоны тела и лица"
  - ru: "Лицо + шея"
    en: "Face + neck"
    note: "Где: M22. Лицо и шея вместе. Знак «+» сохраняется, как в русском прайсе."
    section: "Зоны тела и лица"
  - ru: "Лицо + шея + глаза"
    en: "Face + neck + eye area"
    note: "Где: Morpheus 8. Лицо, шея и зона вокруг глаз."
    section: "Зоны тела и лица"
  - ru: "Лицо + шея + декольте"
    en: "Face + neck + décolleté"
    note: "Где: Morpheus 8. Лицо, шея и верх груди."
    section: "Зоны тела и лица"
  - ru: "Шея + декольте"
    en: "Neck + décolleté"
    note: "Где: M22. Шея и верх груди."
    section: "Зоны тела и лица"
  # — Аппараты и методы —
  - ru: "аппаратная косметология"
    en: "device-based treatments"
    forbidden: ["hardware cosmetology"]
    note: "«Процедуры на аппаратах»: то, что делают лазером, ультразвуком или радиочастотой, а не руками и не уколами. Дословное «hardware cosmetology» англоязычный прочтёт как бессмыслицу: «hardware» — это железо и товары из хозяйственного магазина, а «cosmetology» в США — причёски, маникюр и макияж. Полная форма: device-based aesthetic treatments."
    section: "Аппараты и методы"
  - ru: "аппаратная процедура"
    en: "device-based treatment"
    note: "«Процедура на аппарате» — единственное число от предыдущей строки."
    section: "Аппараты и методы"
  - ru: "аппаратный массаж"
    en: "mechanical massage"
    forbidden: ["hardware massage"]
    note: "Массаж, который делает машина — роликами, вакуумом, вибрацией, — а не руки мастера. «Hardware massage» не говорят."
    section: "Аппараты и методы"
  - ru: "SMAS"
    en: "SMAS"
    note: "Сокращение понятно тем, кто читал о подтяжке лица: слой мышц и соединительной ткани под кожей. Английская расшифровка начинается со слова «superficial» («поверхностная»), поэтому рядом со словом «deep» («глубокий») сокращение не расшифровывается — иначе выйдет «глубокая поверхностная система»."
    section: "Аппараты и методы"
  - ru: "SMAS-лифтинг"
    en: "HIFU"
    forbidden: ["SMAS lift"]
    note: "Где: короткое название в текстах и карточках. Так процедуру называют сами гости. Расшифровка — «high-intensity focused ultrasound», «сфокусированный ультразвук высокой интенсивности» — даётся один раз, при первом упоминании на странице. «SMAS lift» по-английски — операция у пластического хирурга, поэтому буквы SMAS остаются только в выражении «SMAS layer» — «слой SMAS». Полная форма: HIFU treatment."
    section: "Аппараты и методы"
  - ru: "SMAS-слой"
    en: "SMAS layer"
    required: "SMAS"
    note: "«Слой SMAS» — глубина, на которой работает ультразвук."
    section: "Аппараты и методы"
  - ru: "глубокий мышечно-апоневротический слой"
    en: "the deep muscle and connective-tissue layer (SMAS)"
    required: "SMAS"
    forbidden: ["musculoaponeurotic"]
    note: "«Глубокий слой мышц и соединительной ткани». Врачебное слово «musculoaponeurotic» обычный читатель не поймёт, поэтому оно заменено простым описанием; сокращение SMAS стоит рядом в скобках, как в русском."
    section: "Аппараты и методы"
  - ru: "сфокусированный ультразвук"
    en: "focused ultrasound"
    required: "focused ultrasound"
    note: "Ультразвук, собранный в точку на заданной глубине. С добавкой «high-intensity» («высокой интенсивности») получается полное название технологии HIFU. Там, где в русском тексте стоит «сфокусированный ультразвук», в английском остаётся «focused ultrasound»: слово «high-intensity» в такие места не добавляется."
    section: "Аппараты и методы"
  - ru: "RF"
    en: "RF"
    required: "RF"
    note: "Радиочастота. Сокращение знакомо тем, кто интересуется процедурами, остальным помогает расшифровка при первом упоминании. При первом упоминании на странице: radiofrequency, RF."
    section: "Аппараты и методы"
  - ru: "радиочастотная энергия"
    en: "radiofrequency energy"
    note: "Прогрев тканей радиоволнами."
    section: "Аппараты и методы"
  - ru: "игольчатый RF-лифтинг"
    en: "RF microneedling"
    required: "RF"
    forbidden: ["needle RF lifting"]
    note: "«Радиочастотный микронидлинг»: тонкие иглы плюс радиочастота. «Needle RF lifting» — калька, так не говорят и не ищут."
    section: "Аппараты и методы"
  - ru: "микроиглы"
    en: "microneedles"
    note: "Очень тонкие короткие иглы."
    section: "Аппараты и методы"
  - ru: "микроигольчатая процедура"
    en: "microneedling treatment"
    required: "microneedling"
    note: "Процедура с проколами кожи микроиглами. Важно для обещания: слово честно говорит, что иглы есть."
    section: "Аппараты и методы"
  - ru: "изолированные иглы"
    en: "insulated needles"
    forbidden: ["isolated needles"]
    note: "Иглы с изоляцией: энергия выходит только на кончике. Ложный друг переводчика — «isolated needles»: это значило бы «отдельно стоящие иглы»."
    section: "Аппараты и методы"
  - ru: "манипула"
    en: "handpiece"
    forbidden: ["manipula"]
    note: "Насадка-рукоятка аппарата, которую специалист держит в руке. Слова «manipula» в английском нет."
    section: "Аппараты и методы"
  - ru: "Morpheus 8"
    en: "Morpheus8"
    required: "Morpheus8"
    forbidden: ["Morpheus 8"]
    note: "Название аппарата так, как его пишет производитель: слитно, без пробела."
    section: "Аппараты и методы"
  - ru: "M22"
    en: "M22"
    required: "M22"
    forbidden: ["IPL"]
    note: "Название аппарата. Ничего не добавляется: ни производитель, ни тип технологии."
    section: "Аппараты и методы"
  - ru: "платформа M22"
    en: "the M22 platform"
    required: "M22"
    note: "«Платформа» — так по-английски называют аппарат, к одному корпусу которого подключают разные насадки. Слово нейтральное, технологию не называет."
    section: "Аппараты и методы"
  - ru: "фотоомоложение"
    en: "photorejuvenation"
    forbidden: ["IPL"]
    note: "«Фотоомоложение»: омоложение кожи светом. Слово правильное, его поймут, но в поиске почти не набирают. Какой именно свет, слово не говорит — как и русское."
    section: "Аппараты и методы"
  - ru: "фототерапия"
    en: "light-based treatment"
    forbidden: ["phototherapy", "light therapy"]
    note: "«Процедура, которая работает светом». Словарное «phototherapy» у англоязычных — лечение ультрафиолетом у врача (псориаз, желтуха новорождённых), а «light therapy» — лампы от зимней хандры и светодиодные маски."
    section: "Аппараты и методы"
  - ru: "световые импульсы"
    en: "light pulses"
    note: "Короткие вспышки света."
    section: "Аппараты и методы"
  - ru: "фильтры"
    en: "filters"
    note: "Сменные светофильтры аппарата: каждый пропускает свою часть спектра."
    section: "Аппараты и методы"
  - ru: "встроенная система охлаждения"
    en: "built-in cooling system"
    note: "Охлаждение, встроенное в аппарат."
    section: "Аппараты и методы"
  - ru: "LPG"
    en: "LPG"
    required: "LPG"
    note: "Название марки и аппарата."
    section: "Аппараты и методы"
  - ru: "вакуумно-роликовый массаж"
    en: "vacuum-roller massage"
    note: "Массаж роликами с вакуумным втягиванием кожи. В группе экспатов Дананга ту же процедуру называют коротко — «vacuum massage»."
    section: "Аппараты и методы"
  - ru: "костюм для LPG"
    en: "LPG bodysuit"
    forbidden: ["costume"]
    note: "Где: в тексте и позиция прайса «Костюм для LPG». Тонкий эластичный комбинезон на всё тело, который надевают на процедуру. Просто «suit» — деловой костюм, «costume» — карнавальный."
    section: "Аппараты и методы"
  - ru: "эндосфера-терапия"
    en: "Endosphere therapy"
    required: "Endosphere"
    note: "Где: в текстах. То же, что в названии услуги; в тексте второе слово со строчной буквы."
    section: "Аппараты и методы"
  - ru: "компрессионно-микровибрационный массаж"
    en: "compressive microvibration massage"
    note: "Массаж сдавливанием и мелкой вибрацией. Выражение техническое и в английском, но оно принято в описаниях этого метода."
    section: "Аппараты и методы"
  - ru: "УЗ-кавитация"
    en: "Ultrasonic cavitation"
    forbidden: ["US cavitation"]
    note: "Где: в тексте и позиция прайса. Полное название: сокращение «УЗ» не переносится. «US cavitation» прочли бы как «американская кавитация»."
    section: "Аппараты и методы"
  - ru: "ультразвуковые волны"
    en: "ultrasound waves"
    section: "Аппараты и методы"
  - ru: "лимфодренаж"
    en: "lymphatic drainage"
    required: "lymphatic drainage"
    note: "Отток лимфы и лишней жидкости. Слово привычное: массаж так и называют — «lymphatic drainage massage»."
    section: "Аппараты и методы"
  - ru: "детоксикация"
    en: "detoxification"
    required: "detox"
    note: "«Выведение токсинов». Слово рекламное и в английском: строгий читатель отнесётся к нему скептически — ровно как к русскому."
    section: "Аппараты и методы"
  - ru: "моделирование силуэта"
    en: "body shaping"
    note: "«Придание формы телу». Отличается от «body contouring» только оттенком: «contouring» — название направления, «shaping» — описание действия."
    section: "Аппараты и методы"
  - ru: "моделирование контуров тела"
    en: "body contouring"
    note: "То же, что «коррекция фигуры»: в английском это одно выражение."
    section: "Аппараты и методы"
  - ru: "карбоновый состав"
    en: "carbon lotion"
    note: "Жидкая чёрная маска с угольным порошком, которую наносят на кожу перед лазером."
    section: "Аппараты и методы"
  - ru: "лазерный импульс"
    en: "laser pulse"
    note: "Короткая вспышка лазера."
    section: "Аппараты и методы"
  - ru: "голливудская чистка"
    en: "Hollywood peel"
    note: "Устойчивое второе название карбонового пилинга. Русская «чистка» здесь становится «peel» («пилинг»): по-английски процедуру называют именно так."
    section: "Аппараты и методы"
  - ru: "лазерная эпиляция"
    en: "laser hair removal"
    forbidden: ["laser epilation"]
    note: "Где: в текстах. То же, что в названии услуги. Не «laser epilation»."
    section: "Аппараты и методы"
  - ru: "корень волоса"
    en: "hair root"
    note: "Корень волоса. В английских описаниях эпиляции чаще стоит «hair follicle» («фолликул»), но русский текст говорит «корень», а фолликулы упомянуты отдельно."
    section: "Аппараты и методы"
  - ru: "фаза роста волос"
    en: "hair growth phase"
    note: "Стадия, на которой волос активно растёт."
    section: "Аппараты и методы"
  - ru: "луковицы волосков"
    en: "hair follicles"
    note: "Волосяные фолликулы — «мешочки», из которых растут волосы."
    section: "Аппараты и методы"
  - ru: "перманентный макияж"
    en: "permanent makeup"
    forbidden: ["make-up", "make up"]
    note: "Татуаж бровей, век и губ. «Makeup» пишется слитно — это американская норма."
    section: "Аппараты и методы"
  - ru: "перманент"
    en: "permanent makeup"
    note: "Короткой разговорной формы в английском нет: «a permanent» без слова «makeup» — это химическая завивка волос. Поэтому всегда полное выражение."
    section: "Аппараты и методы"
  - ru: "татуаж"
    en: "cosmetic tattoo"
    note: "«Косметическая татуировка» — синоним перманентного макияжа, как и в русском."
    section: "Аппараты и методы"
  - ru: "пигмент"
    en: "pigment"
    note: "Красящее вещество в коже."
    section: "Аппараты и методы"
  - ru: "краситель"
    en: "pigment"
    forbidden: ["dye"]
    note: "В английском тексте то же слово, что для «пигмента»: «dye» — это краска для волос и тканей."
    section: "Аппараты и методы"
  - ru: "частицы краски"
    en: "ink particles"
    note: "Частицы татуировочной краски. Про татуировки говорят «ink» («чернила»), про перманент — «pigment»."
    section: "Аппараты и методы"
  - ru: "HydraFacial"
    en: "HydraFacial"
    required: "HydraFacial"
    note: "Где: в тексте и позиция прайса. Название процедуры и аппарата; пишется слитно, с заглавной F. В поиске встречается и раздельное «hydra facial»."
    section: "Аппараты и методы"
  - ru: "карбокситерапия"
    en: "non-invasive carboxytherapy"
    required: "non-invasive"
    forbidden: ["CO₂ gel mask"]
    note: "Где: в тексте и позиция прайса «Карбокситерапия». «Карбокситерапия без проколов кожи». Одно слово «carboxytherapy» англоязычный услышал бы как уколы углекислого газа под кожу — врачебную процедуру с иглой; «non-invasive» это снимает. Чем именно работают — гелем, маской или аппаратом, — слово не говорит. Позиция прайса: Non-invasive carboxytherapy. Уточнение «(CO₂ gel mask)» не добавлено: в русском прайсе и в текстах стоит только «Карбокситерапия», про гель или маску там ничего нет, а состав и оборудование не додумываются."
    section: "Аппараты и методы"
  - ru: "чистка лица"
    en: "deep cleansing facial"
    forbidden: ["face cleaning", "facial cleansing"]
    note: "Где: в тексте и позиция прайса «Чистка лица». «Салонная глубокая чистка лица» с очищением пор. Дословное «face cleaning» или «facial cleansing» — это просто умывание."
    section: "Аппараты и методы"
  - ru: "ультразвуковая чистка"
    en: "ultrasonic cleansing facial"
    note: "Где: в тексте и позиция прайса. Чистка лица ультразвуковой лопаткой. Слово «cleansing» отличает её от «ультразвуковой терапии» в том же прайсе."
    section: "Аппараты и методы"
  - ru: "профессиональный пилинг"
    en: "professional chemical peel"
    note: "«Химический пилинг, который делает специалист в кабинете». «Chemical peel» — принятое английское название пилинга, при котором кожу обновляют нанесённым составом; по этому слову пилинги и ищут. «Professional» отвечает русскому «профессиональный»."
    section: "Аппараты и методы"
  - ru: "пилинг"
    en: "chemical peel"
    note: "Где: в текстах страницы ухода за лицом. «Химический пилинг»: кожу обновляют нанесённым составом, а не скрабом и не лазером. При повторе в том же абзаце можно писать коротко — «peel». Правило действует только для ухода за лицом: «Карбоновый лазерный пилинг» — лазерная процедура и остаётся «Carbon Laser Peel». Названия позиций прайса тоже не меняются: «Пилинг по типу кожи» — «Peel for your skin type», «Комбо: Чистка + Пилинг» — «Combo: Deep cleansing facial + peel»."
    section: "Аппараты и методы"
  - ru: "уходовая маска"
    en: "facial mask"
    forbidden: ["care mask"]
    note: "Маска для лица как часть процедуры. «Care mask» по-английски не говорят."
    section: "Аппараты и методы"
  - ru: "альгинатная маска"
    en: "alginate mask"
    note: "Где: в тексте и позиция прайса. Маска из водорослей, которая застывает резиновой плёнкой. Любители ухода слово знают, остальным оно ничего не скажет — как и в русском."
    section: "Аппараты и методы"
  - ru: "сыворотка"
    en: "serum"
    note: "Концентрированное средство для кожи."
    section: "Аппараты и методы"
  - ru: "RF-терапия"
    en: "RF therapy"
    required: "RF"
    note: "Где: в тексте и позиция прайса. Прогрев кожи радиочастотой как дополнение к уходу."
    section: "Аппараты и методы"
  - ru: "ультразвуковая терапия"
    en: "ultrasound therapy"
    note: "Где: в тексте и позиция прайса. Воздействие ультразвуком на кожу лица. Слово «therapy» отличает процедуру от «ultrasound» без уточнения — так называют УЗИ."
    section: "Аппараты и методы"
  - ru: "атравматичные методики"
    en: "gentle, non-damaging techniques"
    required: "non-damaging"
    forbidden: ["atraumatic", "non-invasive"]
    note: "«Бережные методики, не повреждающие кожу». Врачебное «atraumatic» обычный читатель не знает. «Non-invasive» значило бы «без проколов и разрезов» — это другое, более узкое утверждение."
    section: "Аппараты и методы"
  - ru: "препараты экспертного класса"
    en: "professional-grade products"
    forbidden: ["expert class", "preparations", "drugs"]
    note: "«Средства профессионального уровня». «Expert class» по-английски ничего не значит; «preparations» звучит по-аптечному, «drugs» — это лекарства."
    section: "Аппараты и методы"
  - ru: "сеанс"
    en: "session"
    note: "Одно посещение, одна процедура."
    section: "Аппараты и методы"
  - ru: "процедура"
    en: "treatment"
    forbidden: ["procedure"]
    note: "Салонная процедура. «Procedure» по-английски — врачебная манипуляция или операция; на сайте центра красоты это слово создаёт образ больницы."
    section: "Аппараты и методы"
  - ru: "курс"
    en: "course"
    forbidden: ["package"]
    note: "Серия сеансов: «a course of 10 sessions». Американцы чаще говорят «series» или «package», но «course» понятно всем. Слово «package» оставлено для русского «пакет»."
    section: "Аппараты и методы"
  - ru: "разовый сеанс"
    en: "single session"
    note: "Одна процедура без покупки курса."
    section: "Аппараты и методы"
  - ru: "комбо"
    en: "combo"
    note: "Набор зон или процедур по общей цене. Слово разговорное, но в прайсах салонов привычное."
    section: "Аппараты и методы"
  - ru: "зона"
    en: "area"
    note: "Участок, который обрабатывают: «treatment area». «Zone» поймут, но клиники пишут «area»."
    section: "Аппараты и методы"
  - ru: "консультация"
    en: "consultation"
    required: "consultation"
    note: "Беседа со специалистом до процедуры."
    section: "Аппараты и методы"
  - ru: "осмотр"
    en: "skin assessment"
    required: "assessment"
    forbidden: ["examination"]
    note: "Специалист смотрит кожу и оценивает её состояние. «Examination» звучит как врачебный осмотр с диагнозом."
    section: "Аппараты и методы"
  # — Состояния и задачи кожи и тела —
  - ru: "акне"
    en: "acne"
    required: "acne"
    note: "Угревая сыпь, прыщи."
    section: "Состояния и задачи кожи и тела"
  - ru: "постакне"
    en: "acne scars"
    required: "acne scars"
    forbidden: ["postacne"]
    note: "Следы после прыщей: рубчики, ямки, пятна. Слова «postacne» в английском нет; говорят «acne scars» (рубцы) и «post-acne marks» (пятна)."
    section: "Состояния и задачи кожи и тела"
  - ru: "рубцы"
    en: "scars"
    required: "scar"
    note: "В английском одно слово на «рубцы» и «шрамы». Русская пара «постакне и рубцы» переводится «acne scars and other scars» — «рубцы после акне и другие рубцы», иначе слово повторится дважды."
    section: "Состояния и задачи кожи и тела"
  - ru: "шрамы"
    en: "scars"
    required: "scar"
    note: "То же слово, что для «рубцов»."
    section: "Состояния и задачи кожи и тела"
  - ru: "воспаления"
    en: "inflammation"
    note: "Воспаление кожи."
    section: "Состояния и задачи кожи и тела"
  - ru: "пигментация"
    en: "pigmentation"
    note: "Тёмные пятна на коже; гости так и говорят — «pigmentation». Не обязателен в паре: «возрастная пигментация» переводится другим выражением."
    section: "Состояния и задачи кожи и тела"
  - ru: "возрастная пигментация"
    en: "age spots"
    forbidden: ["age pigmentation"]
    note: "«Возрастные пятна» — тёмные пятна, которые появляются с годами и от солнца. Дословное «age pigmentation» не говорят."
    section: "Состояния и задачи кожи и тела"
  - ru: "гиперпигментация"
    en: "hyperpigmentation"
    note: "Избыточная пигментация; слово то же, что в русском."
    section: "Состояния и задачи кожи и тела"
  - ru: "неровный тон"
    en: "uneven skin tone"
    note: "Неровный цвет кожи. «Skin tone» — это именно цвет."
    section: "Состояния и задачи кожи и тела"
  - ru: "тусклый цвет лица"
    en: "dull complexion"
    note: "Тусклая, «уставшая» кожа лица. «Complexion» — цвет и вид кожи лица."
    section: "Состояния и задачи кожи и тела"
  - ru: "фотостарение"
    en: "photoaging"
    note: "Старение кожи от солнца. В быту говорят «sun damage» — «повреждение солнцем»."
    section: "Состояния и задачи кожи и тела"
  - ru: "сосудистые несовершенства"
    en: "visible blood vessels"
    required: "blood vessels"
    forbidden: ["vascular imperfections", "vascular lesions"]
    note: "Заметные сосудики и «звёздочки» на коже. Дословное «vascular imperfections» поймут, но так не говорят; врачебное «vascular lesions» («сосудистые поражения») звучит как диагноз."
    section: "Состояния и задачи кожи и тела"
  - ru: "сосудистые изменения"
    en: "visible blood vessels"
    required: "blood vessels"
    note: "В русском тексте это то же самое другими словами; в английском — одно выражение."
    section: "Состояния и задачи кожи и тела"
  - ru: "расширенные поры"
    en: "enlarged pores"
    note: "Расширенные поры. «Large pores» — то же самое разговорно."
    section: "Состояния и задачи кожи и тела"
  - ru: "себум"
    en: "sebum"
    note: "Кожное сало. Слово знакомо тем, кто интересуется уходом; разговорный вариант — «excess oil»."
    section: "Состояния и задачи кожи и тела"
  - ru: "жирность кожи"
    en: "oily skin"
    forbidden: ["skin oiliness"]
    note: "«Жирная кожа». Дословное «skin oiliness» звучит неестественно, «greasiness» — неприятно."
    section: "Состояния и задачи кожи и тела"
  - ru: "морщины"
    en: "wrinkles"
    note: "Морщины. «Fine lines» — только мелкие морщинки."
    section: "Состояния и задачи кожи и тела"
  - ru: "дряблость"
    en: "sagging skin"
    note: "Обвисшая кожа, потерявшая упругость. Профессиональный вариант — «skin laxity»."
    section: "Состояния и задачи кожи и тела"
  - ru: "овал лица"
    en: "facial contours"
    forbidden: ["oval of the face", "jawline"]
    note: "Очертания нижней части лица. «Oval of the face» — калька: по-английски «овальное лицо» — это форма лица. Близкое слово «jawline» называет только линию челюсти."
    section: "Состояния и задачи кожи и тела"
  - ru: "тонус"
    en: "firmness"
    forbidden: ["skin tone"]
    note: "Упругость, подтянутость кожи. Ложный друг переводчика: «skin tone» — это цвет кожи."
    section: "Состояния и задачи кожи и тела"
  - ru: "упругость"
    en: "elasticity"
    note: "Способность кожи пружинить и возвращать форму."
    section: "Состояния и задачи кожи и тела"
  - ru: "плотность кожи"
    en: "skin density"
    note: "Плотность кожи; выражение принято в описаниях процедур."
    section: "Состояния и задачи кожи и тела"
  - ru: "текстура кожи"
    en: "skin texture"
    note: "Гладкость и ровность поверхности кожи."
    section: "Состояния и задачи кожи и тела"
  - ru: "коллаген"
    en: "collagen"
    section: "Состояния и задачи кожи и тела"
  - ru: "эластин"
    en: "elastin"
    section: "Состояния и задачи кожи и тела"
  - ru: "эпидермис"
    en: "epidermis"
    note: "Верхний слой кожи."
    section: "Состояния и задачи кожи и тела"
  - ru: "дерма"
    en: "dermis"
    note: "Средний, глубокий слой кожи."
    section: "Состояния и задачи кожи и тела"
  - ru: "защитный барьер кожи"
    en: "skin barrier"
    note: "Защитный слой кожи; устойчивое выражение в уходе за кожей."
    section: "Состояния и задачи кожи и тела"
  - ru: "подкожно-жировая клетчатка"
    en: "subcutaneous fat"
    note: "Жир под кожей."
    section: "Состояния и задачи кожи и тела"
  - ru: "целлюлит"
    en: "cellulite"
    required: "cellulite"
    forbidden: ["cellulitis"]
    note: "«Апельсиновая корка». Не путать с «cellulitis» — это бактериальное воспаление кожи, которое лечат антибиотиками."
    section: "Состояния и задачи кожи и тела"
  - ru: "отёки"
    en: "fluid retention"
    forbidden: ["swelling", "edema"]
    note: "Задержка жидкости, отёчность. Для лица рядом можно поставить «puffiness» — «одутловатость». «Swelling» означало бы опухание после травмы, «edema» — диагноз."
    section: "Состояния и задачи кожи и тела"
  - ru: "локальные жировые отложения"
    en: "localized fat deposits"
    note: "Жир на отдельных участках тела."
    section: "Состояния и задачи кожи и тела"
  - ru: "жировые клетки"
    en: "fat cells"
    section: "Состояния и задачи кожи и тела"
  - ru: "локальные объёмы"
    en: "circumference of targeted areas"
    forbidden: ["local volumes"]
    note: "Обхват отдельных участков тела в сантиметрах. Дословное «local volumes» по-английски непонятно."
    section: "Состояния и задачи кожи и тела"
  - ru: "рельеф тела"
    en: "body contours"
    forbidden: ["relief"]
    note: "Очертания тела. Ложный друг переводчика: «relief» по-английски — «облегчение»."
    section: "Состояния и задачи кожи и тела"
  # — Результат, ощущения, безопасность —
  - ru: "противопоказания"
    en: "contraindications"
    required: "contraindication"
    note: "Состояния, при которых процедуру делать нельзя. Слово врачебное, но понятное."
    section: "Результат, ощущения, безопасность"
  - ru: "свежий загар"
    en: "a recent tan"
    required: "tan"
    note: "Загар, полученный недавно."
    section: "Результат, ощущения, безопасность"
  - ru: "активное солнце"
    en: "strong sun exposure"
    required: "sun"
    forbidden: ["active sun"]
    note: "Пребывание под сильным солнцем. «Active sun» — калька, так не говорят."
    section: "Результат, ощущения, безопасность"
  - ru: "сахарный диабет"
    en: "diabetes"
    required: "diabetes"
    note: "Диабет. Полное «diabetes mellitus» пишут только врачи."
    section: "Результат, ощущения, безопасность"
  - ru: "ВИЧ/СПИД"
    en: "HIV/AIDS"
    required: "HIV/AIDS"
    note: "ВИЧ и СПИД; пишется так же, через косую черту."
    section: "Результат, ощущения, безопасность"
  - ru: "кожные заболевания"
    en: "skin diseases"
    required: "skin disease"
    forbidden: ["skin conditions"]
    note: "Болезни кожи. Мягкое «skin conditions» шире: оно включает и обычные прыщи, и запрет стал бы другим."
    section: "Результат, ощущения, безопасность"
  - ru: "восстановление"
    en: "recovery"
    required: "recovery"
    note: "Заживление после процедуры. Только существительное: глагол «восстанавливать» в выражении «восстанавливают защитный барьер кожи» переводится «restore» и к этой строке не относится."
    section: "Результат, ощущения, безопасность"
  - ru: "период восстановления"
    en: "recovery period"
    required: "recovery"
    note: "Время, пока кожа заживает."
    section: "Результат, ощущения, безопасность"
  - ru: "длительное восстановление"
    en: "lengthy recovery"
    required: "recovery"
    note: "Долгое заживление. Слово «lengthy» («длительное») обязательно остаётся: без него обещание стало бы сильнее."
    section: "Результат, ощущения, безопасность"
  - ru: "реабилитация"
    en: "downtime"
    required: "downtime"
    forbidden: ["rehabilitation"]
    note: "Время, на которое человек выпадает из обычной жизни после процедуры. «Rehabilitation» значит другое: восстановление после травмы, инсульта или зависимости."
    section: "Результат, ощущения, безопасность"
  - ru: "безоперационный"
    en: "non-surgical"
    required: "non-surgical"
    note: "Без операции."
    section: "Результат, ощущения, безопасность"
  - ru: "без операции"
    en: "without surgery"
    required: "surgery"
    section: "Результат, ощущения, безопасность"
  - ru: "без хирургии"
    en: "without surgery"
    required: "surgery"
    note: "То же выражение, что для «без операции»."
    section: "Результат, ощущения, безопасность"
  - ru: "безболезненно"
    en: "painless"
    required: "painless"
    forbidden: ["completely", "virtually"]
    note: "Без боли. Сила обещания та же: не добавляется «completely» («совершенно») и не ставится «virtually» («практически»)."
    section: "Результат, ощущения, безопасность"
  - ru: "без синяков"
    en: "no bruising"
    required: "bruising"
    note: "Синяков не остаётся."
    section: "Результат, ощущения, безопасность"
  - ru: "не оставляет шрамов"
    en: "leaves no scars"
    required: "scar"
    note: "Шрамов не остаётся."
    section: "Результат, ощущения, безопасность"
  - ru: "не повреждает кожу"
    en: "does not damage the skin"
    required: "damage"
    note: "Кожа остаётся целой."
    section: "Результат, ощущения, безопасность"
  - ru: "не повреждает сосуды"
    en: "does not damage blood vessels"
    required: "damage"
    note: "Сосуды остаются целыми."
    section: "Результат, ощущения, безопасность"
  - ru: "тепло и лёгкое покалывание"
    en: "warmth and a slight tingling"
    required: "tingling"
    note: "Ощущение тепла и слабого покалывания."
    section: "Результат, ощущения, безопасность"
  - ru: "переносимость"
    en: "tolerance"
    note: "Сколько человеку комфортно выдержать."
    section: "Результат, ощущения, безопасность"
  - ru: "чувствительность"
    en: "sensitivity"
    note: "Насколько остро ощущается воздействие."
    section: "Результат, ощущения, безопасность"
  - ru: "интенсивность"
    en: "intensity"
    note: "Сила воздействия аппарата."
    section: "Результат, ощущения, безопасность"
  - ru: "результат формируется постепенно"
    en: "results develop gradually"
    required: "gradually"
    note: "Результат появляется не сразу, а со временем."
    section: "Результат, ощущения, безопасность"
  - ru: "сохраняется надолго"
    en: "long-lasting"
    required: "long-lasting"
    forbidden: ["permanent"]
    note: "Держится долго. Нельзя «permanent» — «навсегда»."
    section: "Результат, ощущения, безопасность"
  - ru: "видимый результат"
    en: "visible results"
    required: "visible"
    note: "Результат, который видно."
    section: "Результат, ощущения, безопасность"
  - ru: "долгосрочная гладкость"
    en: "long-lasting smoothness"
    required: "long-lasting"
    forbidden: ["permanent", "permanent hair removal"]
    note: "Гладкость надолго. Нельзя «permanent hair removal» — «удаление волос навсегда»."
    section: "Результат, ощущения, безопасность"
  - ru: "лифтинг"
    en: "lifting"
    note: "Подтяжка. «Lifting effect» — «эффект подтяжки»; название процедуры — «lift». Об эффекте — «lifting», о процедуре — «lift». Не обязателен в паре: слово входит в названия услуг («SMAS-лифтинг», «RF-лифтинг»), которые переводятся иначе."
    section: "Результат, ощущения, безопасность"
  - ru: "подтяжка"
    en: "lift"
    required: "lift"
    note: "«Non-surgical face lift» — «безоперационная подтяжка лица». Без слова «non-surgical» «face lift» означает операцию."
    section: "Результат, ощущения, безопасность"
  - ru: "омоложение"
    en: "rejuvenation"
    required: "rejuvenation"
    note: "Омоложение. Близкое по смыслу «anti-aging» — «против старения». Проверка «rejuvenation» не относится к слову «фотоомоложение»."
    section: "Результат, ощущения, безопасность"
  - ru: "уплотнение кожи"
    en: "skin firming"
    required: "firm"
    forbidden: ["thickening"]
    note: "Кожа становится плотнее и упруже. «Thickening» («утолщение») звучало бы как проблема."
    section: "Результат, ощущения, безопасность"
  - ru: "похудение"
    en: "slimming"
    required: "slimming"
    forbidden: ["weight loss"]
    note: "Уменьшение объёмов тела. «Weight loss» — потеря килограммов: это было бы другое и более сильное обещание."
    section: "Результат, ощущения, безопасность"
  - ru: "уменьшение объёмов"
    en: "circumference reduction"
    required: "circumference"
    note: "Уменьшение обхвата в сантиметрах."
    section: "Результат, ощущения, безопасность"
  - ru: "подбирают индивидуально"
    en: "tailored individually"
    required: "individually"
    note: "Подбирают под конкретного человека."
    section: "Результат, ощущения, безопасность"
  - ru: "на консультации"
    en: "at the consultation"
    required: "consultation"
    note: "Во время беседы со специалистом до процедуры."
    section: "Результат, ощущения, безопасность"
  - ru: "после осмотра"
    en: "after a skin assessment"
    required: "assessment"
    note: "После того как специалист посмотрит кожу."
    section: "Результат, ощущения, безопасность"
  # — Роли и организация —
  - ru: "косметолог"
    en: "aesthetician"
    forbidden: ["cosmetologist", "aesthetic doctor", "dermatologist", "doctor", "physician"]
    note: "Специалист по уходу за кожей без врачебного диплома: тот, кто делает чистки, пилинги и аппаратные процедуры. Врача это слово не обещает. Словарное «cosmetologist» в США — выпускник школы красоты: парикмахер, мастер маникюра и макияжа. «Aesthetic doctor» и «dermatologist» значили бы «врач»; так специалиста называть нельзя."
    section: "Роли и организация"
  - ru: "центр красоты"
    en: "beauty center"
    forbidden: ["clinic", "beauty salon"]
    note: "«Центр красоты»: дословно и нейтрально. Медицинского учреждения слово не обещает — в отличие от «clinic» («клиника»), которое про себя мы не используем. «Beauty salon» тоже не годится: в Дананге под этим словом Google показывает парикмахерские и маникюр."
    section: "Роли и организация"
  - ru: "центр красоты и косметологии"
    en: "beauty and aesthetics center"
    forbidden: ["cosmetology"]
    note: "«Центр красоты и эстетических процедур». «Aesthetics» — эстетические процедуры для кожи и тела. Словарное «cosmetology» нельзя: в США это парикмахерское дело, маникюр и макияж."
    section: "Роли и организация"
  - ru: "приём по записи"
    en: "by appointment only"
    required: "appointment"
    note: "Прийти можно только по предварительной договорённости."
    section: "Роли и организация"
  - ru: "предварительная запись"
    en: "booking in advance"
    note: "Нужно договориться о времени заранее."
    section: "Роли и организация"
  - ru: "обслуживание на русском и английском языках"
    en: "service in Russian and English"
    required: "English"
    note: "Со специалистом можно говорить по-русски и по-английски. Для экспата это один из главных поводов выбрать салон. В коротких местах: English and Russian spoken."
    section: "Роли и организация"
  - ru: "Эпиляция"
