  - path: services.morpheus-8-rf-lifting.benefits[0].text
    check: numbers
    reason: &device_name 'Карточка «Why … Works» называет аппарат (отложенная находка GEO-04, этап 11): русская страница называет процедуру «Morpheus 8», а части аппарата — его манипулы, встроенная система охлаждения и световые импульсы платформы M22. В русской карточке название не стоит, поэтому проверка чисел видит лишние 8 или 22 — это часть названия аппарата по глоссарию (Morpheus8, M22), а не число. Других чисел в строке нет ни в русском, ни в английском.'
