# Одобренные отступления автотеста пар строк (generator/translation_pairs.py).
# Автотест сверяет русскую и английскую строку: числа, плейсхолдеры {…}, ссылки, теги и
# обязательные термины глоссария. Исключение снимает ОДНУ проверку ОДНОЙ строки.
#
# Формат записи:
#   - path:   путь строки так, как его печатает translation_status.py en:
#             services.lpg-massazh.faq[2].a   — текст страницы;
#             site tagline                    — строка site;
#             prices names «Лоб»              — название или раздел прайса;
#             privacy                         — политика целиком;
#     check:  numbers | placeholders | links | tags | terms;
#     term:   только для terms — слово required из глоссария (снимается один термин, а не все);
#     placeholder: только для placeholders — плейсхолдер вида {имя} (снимается один, а не все);
#     reason: почему отступление намеренное (обязательно).
#
# Исключение без причины, с неизвестной проверкой, на строку, которой нет среди пар, и
# устаревшее (строку исправили, и оно ничего не снимает) — проблемы перевода: сборка падает.
#
# Пишет исключения только основная сессия (Opus) после разбора находки. Ложная тревога
# термина лечится полем ru_match в glossary.yml, а не исключением. Настоящая ошибка
# перевода исправляется в переводе.

exceptions:
  - path: privacy
    check: links
    reason: 'П. 12.3: английская версия называет адрес своей английской страницы /en/privacy/ (одобрено на сравнении, E-0610). П. 1.2, 2.3, 2.6, 2.7: текст по-прежнему называет домен https://vn.neva.beauty, а ссылка ведёт на английскую главную /en/ — с английской страницы гость не должен попадать на русскую (находка check_i18n, 2026-10-17).'
  - path: home.faq[1].a
    check: placeholders
    placeholder: '{dermatology_consultation_price}'
    reason: &ru_only_dermatology 'владелец: дерматология только на русском (ответ 2026-10-26, пункт 5 F5). Русский ответ о записи называет консультацию дерматолога и плейсхолдер {dermatology_consultation_price}, в английском дерматолога нет. Снимается только этот плейсхолдер: остальные плейсхолдеры строки проверяются.'
  - path: categories[0].faq[4].a
