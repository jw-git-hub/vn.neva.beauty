name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой за раз; новые пуши отменяют предыдущий прогон.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site
        run: python generator/build.py

      # Гарантия точности цен: сверяет прайс в HTML и в JSON-LD с prices.json.
      # Стоит до загрузки артефакта — расхождение в ценах не должно доехать до прода.
      - name: Check price parity
        run: python generator/check_prices.py

      # Пропуск уровня заголовков (h1 → h3) невидим глазом, но ломает навигацию
      # скринридером и валидность — три страницы жили с этим незамеченными.
      - name: Check heading hierarchy
        run: python generator/check_headings.py

      # Сорвавшийся или битый путь картинки виден только глазами на живом сайте:
      # hero главной так и не догрузился во встроенном браузере Instagram.
      - name: Check images
        run: python generator/check_images.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vn.neva.beauty

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
